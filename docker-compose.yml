version: "3.8"
services:
  kiosk:
    build: .
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/data/kiosk.db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - STAFF_PIN=${STAFF_PIN:-1234}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o}
      - ASSET_CLEANUP_HOURS=${ASSET_CLEANUP_HOURS:-24}
      - SHOP_NAME=${SHOP_NAME:-Your Jewellery Shop}
      - SHOP_ADDRESS=${SHOP_ADDRESS:-}
      - SHOP_PHONE=${SHOP_PHONE:-}
      - SHOP_EMAIL=${SHOP_EMAIL:-}
    volumes:
      - kiosk_db:/data
      - kiosk_uploads:/app/public/uploads
    restart: unless-stopped

volumes:
  kiosk_db:
  kiosk_uploads:
